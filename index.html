<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      Telegram Mini App: the official client script is deliberately NOT loaded
      here. It used to sit first in <head> as a plain <script src>, which meant
      the parser never reached the game module until telegram.org answered — and
      a blocked host does not answer, it swallows the connection. Measured with
      the host dropped: after 40 seconds the document still had no <body>, no
      page style and no canvas, i.e. a blank screen and no game (issue #16). The
      style below is declared after this comment, so not even the dark page
      survives it — the player gets white. The players
      are Russian-speaking, and the game is opened from GitHub Pages and itch.io
      as well as from Telegram, so «telegram.org is reachable» is not something
      the game may depend on to start.

      src/game/tg.ts loads it instead: asynchronously, after the game has already
      started, and only when the URL carries Telegram's own launch parameters.
      Nothing is lost by that. Without those parameters the script only leaves
      its «6.0» stub — an empty session, every call in tg.ts version-gated above
      it — and sets --tg-viewport-stable-height to the literal `100vh`, which is
      exactly what the var() fallback below already resolves to.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070d" />
    <title>ВОСТОК-9</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #05070d;
        color: #e6ecff;
        font-family: system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      #game {
        position: fixed;
        display: flex;
        align-items: center;
        justify-content: center;
        /*
         * Safe-area (issue #8 + Telegram Mini App): reserve room under the
         * camera notch / system bars via env(safe-area-inset-*) and, when the
         * game runs as a Telegram Mini App, under Telegram's own chrome (the
         * expanded header and the bottom action bar) via
         * --tg-content-safe-area-inset-*. Outside Telegram the --tg-* variables
         * are undefined, fall back to 0px, and the insets reduce to the plain
         * env() the game always had — so the web build looks exactly as before.
         * The insets are taken off the **box itself**, not added as padding
         * inside it. Phaser's Scale.FIT measures the parent's border box, so
         * padding is invisible to it: measured with an emulated 47 px notch and
         * a 34 px bottom bar, a padded #game still produced a 698 px canvas that
         * ran from y = 6.5 to y = 704.5 — under the notch, under the system bar
         * and 6.5 px off the bottom of the screen, with НАЧАТЬ СМЕНУ and the
         * hangar bar inside the unsafe strip. A shrunken box gives Phaser the
         * safe rectangle to fit into, which is the whole point.
         * max() needs like units; env() and the var() fallback both resolve to
         * px. The viewport meta has viewport-fit=cover, which is what makes
         * env()'s safe-area-inset-* report non-zero on devices with a notch.
         */
        --safe-top: max(env(safe-area-inset-top), var(--tg-content-safe-area-inset-top, 0px));
        --safe-right: max(
          env(safe-area-inset-right),
          var(--tg-content-safe-area-inset-right, 0px)
        );
        --safe-bottom: max(
          env(safe-area-inset-bottom),
          var(--tg-content-safe-area-inset-bottom, 0px)
        );
        --safe-left: max(
          env(safe-area-inset-left),
          var(--tg-content-safe-area-inset-left, 0px)
        );
        top: var(--safe-top);
        right: var(--safe-right);
        bottom: var(--safe-bottom);
        left: var(--safe-left);
        box-sizing: border-box;
      }

      #game canvas {
        display: block;
        touch-action: none;
      }

      /*
       * Rotation prompt (issue #8). The game canvas FIT-adapts and never
       * breaks on rotation, and screen.orientation.lock keeps the page portrait
       * where the browser allows it. For browsers without lock support we show
       * this overlay while the device is held sideways, so the player turns it
       * back. It is shown only on phone-sized viewports (the JS toggles
       * body.landscape) — a wide desktop window must not block the game.
       */
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        background: #05070d;
        color: #e6ecff;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }

      /* A phone turned sideways: block the game with a «turn the phone» note. */
      body.landscape #rotate {
        display: flex;
      }

      #rotate .box {
        max-width: 320px;
      }

      #rotate .arrow {
        font-size: 64px;
        margin-bottom: 16px;
      }

      #rotate .title {
        font-size: 26px;
        font-weight: 700;
        margin: 0 0 8px;
      }

      #rotate .hint {
        font-size: 18px;
        color: #8fa3c8;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <div class="box">
        <div class="arrow">⟲</div>
        <p class="title">Поверни телефон</p>
        <p class="hint">Игра работает в вертикальной ориентации</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
