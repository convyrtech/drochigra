<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      Telegram Mini App: the official client script. It must run before the
      game module so window.Telegram.WebApp is ready when src/main.ts starts.
      First in <head> as required. If it cannot load (no network / blocker),
      window.Telegram stays undefined and src/game/tg.ts degrades to a no-op,
      so the game still runs exactly as before in a plain browser.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070d" />
    <title>ВОСТОК-9</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #05070d;
        color: #e6ecff;
        font-family: system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      #game {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        /*
         * Safe-area (issue #8 + Telegram Mini App): reserve room under the
         * camera notch / system bars via env(safe-area-inset-*) and, when the
         * game runs as a Telegram Mini App, under Telegram's own chrome (the
         * expanded header and the bottom action bar) via
         * --tg-content-safe-area-inset-*. Outside Telegram the --tg-* variables
         * are undefined, fall back to 0px, and the padding reduces to the plain
         * env() the game always had — so the web build looks exactly as before.
         * The canvas is FIT-scaled and centred inside this padded box
         * (CENTER_BOTH), so its bottom edge — where НАЧАТЬ СМЕНУ and the hangar
         * bar sit — never reaches the system bars or Telegram's overlay panels.
         * max() needs like units; env() and the var() fallback both resolve to
         * px. The viewport meta has viewport-fit=cover, which is what makes
         * env()'s safe-area-inset-* report non-zero on devices with a notch.
         */
        --safe-top: max(env(safe-area-inset-top), var(--tg-content-safe-area-inset-top, 0px));
        --safe-right: max(
          env(safe-area-inset-right),
          var(--tg-content-safe-area-inset-right, 0px)
        );
        --safe-bottom: max(
          env(safe-area-inset-bottom),
          var(--tg-content-safe-area-inset-bottom, 0px)
        );
        --safe-left: max(
          env(safe-area-inset-left),
          var(--tg-content-safe-area-inset-left, 0px)
        );
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        box-sizing: border-box;
      }

      #game canvas {
        display: block;
        touch-action: none;
      }

      /*
       * Rotation prompt (issue #8). The game canvas FIT-adapts and never
       * breaks on rotation, and screen.orientation.lock keeps the page portrait
       * where the browser allows it. For browsers without lock support we show
       * this overlay while the device is held sideways, so the player turns it
       * back. It is shown only on phone-sized viewports (the JS toggles
       * body.landscape) — a wide desktop window must not block the game.
       */
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        background: #05070d;
        color: #e6ecff;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }

      /* A phone turned sideways: block the game with a «turn the phone» note. */
      body.landscape #rotate {
        display: flex;
      }

      #rotate .box {
        max-width: 320px;
      }

      #rotate .arrow {
        font-size: 64px;
        margin-bottom: 16px;
      }

      #rotate .title {
        font-size: 26px;
        font-weight: 700;
        margin: 0 0 8px;
      }

      #rotate .hint {
        font-size: 18px;
        color: #8fa3c8;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <div class="box">
        <div class="arrow">⟲</div>
        <p class="title">Поверни телефон</p>
        <p class="hint">Игра работает в вертикальной ориентации</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
